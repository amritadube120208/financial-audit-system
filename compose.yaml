services:
  backend:
    build: .
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/auditgraph.db
      RECOVERY_DIR: /data/recovery
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - audit-data:/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  audit-data:
